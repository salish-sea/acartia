post:
  summary: Sign in
  operationId: signIn

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - username
            - password
          properties:
            username:
              type: string
            password:
              type: string

  responses:
    "200":
      description: Sign in successful

    "401":
      description: Wrong username or password
      content:
        application/json:
          schema:
            $ref: "../models/api-error.yml"
