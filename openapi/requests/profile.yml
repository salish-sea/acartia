get:
  summary: Get the current / logged in users details
  operationId: getCurrentUser

  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: "../models/user.yml"

put:
  summary: Update the current users profile details.
  operationId: updateUserDetails

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
          properties:
            name:
              type: string
            email:
              type: string
            website:
              type: string

  responses:
    "200":
      description: Successfully updated user profile.

    "400":
      description: Name or email cannot be empty
      content:
        application/json:
          schema:
            $ref: "../models/api-error.yml"

    "404":
      description: User not found
      content:
        application/json:
          schema:
            $ref: "../models/api-error.yml"

delete:
  summary: Delete the current users profile.
  operationId: deleteProfile

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - password
          properties:
            password:
              type: string

    responses:
      "200":
        description: Successfully deleted user profile.

      "400":
        description: Name or email cannot be empty
        content:
          application/json:
            schema:
              $ref: "../models/api-error.yml"

      "404":
        description: User not found
        content:
          application/json:
            schema:
              $ref: "../models/api-error.yml"
