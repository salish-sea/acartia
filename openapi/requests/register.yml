post:
  summary: Sign up
  operationId: register

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - password
          properties:
            name:
              type: string
            email:
              type: string
            password:
              type: string

  responses:
    "201":
      description: Successfully registered user.

    "400":
      description: Email already exists.
      content:
        application/json:
          schema:
            $ref: "../models/api-error.yml"
